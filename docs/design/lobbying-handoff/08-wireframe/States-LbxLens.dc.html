<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public company lens · states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lbx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="lbx-root lbx-dark" style="width: 1456px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="lbx-kicker" style="color: var(--emerald-text);">{{s.label}}</div>
      <dc-import name="LbxLens" state="{{s.key}}" hint-size="1392px,600px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1456,"height":3420}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [['default', 'Default'], ['loading', 'Loading'], ['empty', 'Filtered to empty'], ['partial', 'Partial period'], ['error', 'Error']].map(([key, label]) => ({ key, label })) };
  }
}
</script>
</body>
</html>
