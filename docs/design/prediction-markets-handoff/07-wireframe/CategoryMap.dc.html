<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category map</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pmk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pmk-root" style="width: 100%; display: flex;">
<section class="pmk-card" aria-labelledby="pmk-map-title" style="flex: 1; width: 100%; display: flex; flex-direction: column;">
  <div class="pmk-head">
    <div>
      <h2 id="pmk-map-title" class="pmk-title">Category map</h2>
      <p class="pmk-sub">Area: volume · Colour: avg move · 7d</p>
    </div>
    <div class="pmk-seg" role="radiogroup" aria-label="Venue">
      <sc-for list="{{venues}}" as="v" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{v.on}}" class="{{v.cls}}" onClick="{{v.pick}}">{{v.label}}</button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showTree}}" hint-placeholder-val="{{ true }}">
    <div role="group" aria-label="Categories by volume. Select one to filter the page." style="position: relative; height: 440px; margin: -2px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" aria-label="{{t.aria}}" style="position: absolute; left: {{t.l}}; top: {{t.t}}; width: {{t.w}}; height: {{t.h}}; padding: 2px; background: none; border: 0; text-align: left; color: inherit;">
          <span style="position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 100%; height: 100%; padding: {{t.pad}}; border-radius: var(--radius-md); overflow: hidden; border: {{t.border}}; transition: border-color 0.15s ease-out;">
            <span aria-hidden="true" style="position: absolute; inset: 0; background: {{t.fill}}; opacity: {{t.alpha}};"></span>
            <span style="position: relative; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: {{t.fs}}; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.name}}</span>
              <sc-if value="{{t.big}}" hint-placeholder-val="{{ true }}">
                <span class="pmk-mono" style="font-size: 12px; color: var(--text-secondary);">{{t.vol}}</span>
              </sc-if>
            </span>
            <sc-if value="{{t.big}}" hint-placeholder-val="{{ true }}">
              <span style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;">
                <span class="pmk-mono" style="font-size: 11px; color: var(--text-muted);">{{t.n}} mkts</span>
                <span class="pmk-mono" style="font-size: 11px; font-weight: 700; color: {{t.moveColor}};">{{t.move}}</span>
              </span>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showBar}}" hint-placeholder-val="{{ false }}">
    <div role="img" aria-label="Volume share by category" style="display: flex; height: 28px; border-radius: var(--radius-md); overflow: hidden; gap: 2px; margin-bottom: 12px;">
      <sc-for list="{{rows}}" as="t" hint-placeholder-count="8">
        <span style="flex: {{t.v}}; position: relative;"><span style="position: absolute; inset: 0; background: {{t.fill}}; opacity: {{t.barAlpha}};"></span></span>
      </sc-for>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0;">
      <sc-for list="{{rows}}" as="t" hint-placeholder-count="8">
        <li>
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" class="pmk-row pmk-row-btn" style="display: flex; align-items: center; gap: 10px; padding: 9px 6px; min-height: 44px; border-bottom: 1px solid var(--border-secondary); background: {{t.rowBg}};">
            <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; position: relative; flex: none; border: 1px solid var(--border-primary);"><span style="position: absolute; inset: 0; background: {{t.fill}}; opacity: {{t.barAlpha}};"></span></span>
            <span style="flex: 1; font-size: 13px; font-weight: 600; color: var(--text-primary);">{{t.name}}</span>
            <span class="pmk-mono" style="font-size: 12px; color: var(--text-secondary); width: 64px; text-align: right;">{{t.vol}}</span>
            <span class="pmk-mono" style="font-size: 11px; color: var(--text-muted); width: 44px; text-align: right;">{{t.n}}</span>
            <span class="pmk-mono" style="font-size: 11px; font-weight: 700; color: {{t.moveColor}}; width: 52px; text-align: right;">{{t.move}}</span>
          </button>
        </li>
      </sc-for>
    </ul>
  </sc-if>

  <sc-if value="{{isDefault}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted);">
        <span>Fading</span>
        <span aria-hidden="true" style="display: flex; width: 132px; height: 8px; border-radius: var(--radius-sm); overflow: hidden;">
          <span style="flex: 1; background: var(--echo-chart-red); opacity: 0.55;"></span><span style="flex: 1; background: var(--echo-chart-red); opacity: 0.3;"></span><span style="flex: 1; background: var(--echo-chart-red); opacity: 0.12;"></span><span style="flex: 1; background: var(--emerald); opacity: 0.12;"></span><span style="flex: 1; background: var(--emerald); opacity: 0.3;"></span><span style="flex: 1; background: var(--emerald); opacity: 0.55;"></span>
        </span>
        <span>Firming</span>
        <span class="pmk-mono" style="color: var(--text-faint);">±3 pts</span>
      </div>
      <span style="font-size: 11px; color: var(--text-faint);">Select a tile to filter the page · {{note}}</span>
    </div>
  </sc-if>

  <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" aria-label="Loading category map" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 4px; height: 440px;">
      <span class="pmk-skel" style="grid-column: span 2; grid-row: span 2; border-radius: var(--radius-md);"></span>
      <span class="pmk-skel" style="grid-row: span 2; border-radius: var(--radius-md);"></span>
      <span class="pmk-skel" style="border-radius: var(--radius-md);"></span>
      <span class="pmk-skel" style="border-radius: var(--radius-md);"></span>
      <span class="pmk-skel" style="border-radius: var(--radius-md);"></span>
    </div>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
    <div style="height: 440px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; border: 1px dashed var(--border-primary); border-radius: var(--radius-md); padding: 24px;">
      <div style="font-size: 15px; font-weight: 600; color: var(--text-primary);">No volume traded in this window</div>
      <p class="pmk-state-msg" style="margin: 0; max-width: 340px;">Kalshi reported no trades in the last 24 hours for these filters. Try 7d or Both venues.</p>
    </div>
  </sc-if>

  <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="height: 440px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 1px dashed var(--border-primary); border-radius: var(--radius-md);">
      <p class="pmk-state-msg" style="margin: 0;">This data is unavailable right now. Try again in a moment.</p>
      <button type="button" class="pmk-link" style="background: none; border: 0; font-size: 14px; padding: 0;">Retry</button>
    </div>
  </sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","loading","empty","error"],"default":"default"},"viewport":{"editor":"enum","options":["desktop","tablet","mobile"],"default":"desktop"},"$preview":{"width":580,"height":860}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { venue: 'Polymarket', sel: 'Elections' }; }
  renderVals() {
    const s = this.props.state ?? 'default';
    const mobile = (this.props.viewport ?? 'desktop') === 'mobile';
    const data = {
      Polymarket: [['Politics', 148, 360, 1.8], ['Elections', 121, 218, 3.2], ['Sports', 96, 783, -0.6], ['Crypto', 64, 286, -2.4], ['Geopolitics', 58, 188, -1.5], ['Economy', 22, 124, 0.9], ['Culture', 14, 101, 0.3], ['Tech', 9, 94, -0.4]],
      Kalshi: [['Sports', 4.1, 321, 0.4], ['Elections', 2.9, 248, 2.1], ['Politics', 1.2, 52, 1.1], ['Culture', 0.4, 23, -0.2], ['Economy', 0.2, 7, -1.3], ['Tech', 0.1, 3, 0.2]],
      Both: [['Politics', 149.2, 412, 1.7], ['Elections', 123.9, 466, 2.9], ['Sports', 100.1, 1104, -0.4], ['Crypto', 64, 286, -2.4], ['Geopolitics', 58, 188, -1.5], ['Economy', 22.2, 131, 0.8], ['Culture', 14.4, 124, 0.2], ['Tech', 9.1, 97, -0.4]]
    };
    const venue = this.state.venue;
    const isK = venue === 'Kalshi';
    const items = data[venue].map(([name, v, n, m]) => ({ name, v, n, m }));
    const W = 530, H = 440, total = items.reduce((a, b) => a + b.v, 0);
    let rest = items.map((d) => ({ ...d, a: (d.v / total) * W * H }));
    let x = 0, y = 0, w = W, h = H; const out = [];
    while (rest.length) {
      const short = Math.min(w, h);
      const worst = (r) => { const sum = r.reduce((a, b) => a + b.a, 0), mx = Math.max(...r.map((z) => z.a)), mn = Math.min(...r.map((z) => z.a)); return Math.max((short * short * mx) / (sum * sum), (sum * sum) / (short * short * mn)); };
      let row = [rest[0]], i = 1;
      while (i < rest.length && worst(row.concat(rest[i])) <= worst(row)) { row.push(rest[i]); i++; }
      const sum = row.reduce((a, b) => a + b.a, 0);
      if (w >= h) { const cw = sum / h; let cy = y; row.forEach((r) => { const rh = r.a / cw; out.push({ ...r, x, y: cy, w: cw, h: rh }); cy += rh; }); x += cw; w -= cw; }
      else { const rh = sum / w; let cx = x; row.forEach((r) => { const cw = r.a / rh; out.push({ ...r, x: cx, y, w: cw, h: rh }); cx += cw; }); y += rh; h -= rh; }
      rest = rest.slice(i);
    }
    const fmt = (v) => isK ? (v >= 1 ? v.toFixed(1) + 'M ct' : Math.round(v * 1000) + 'K ct') : '$' + (v >= 1 ? v.toFixed(v >= 100 ? 0 : 1) + 'M' : Math.round(v * 1000) + 'K');
    const decorate = (t) => {
      const on = this.state.sel === t.name;
      const alpha = (0.1 + Math.min(Math.abs(t.m), 3) / 3 * 0.38).toFixed(2);
      return {
        ...t, on: String(on), vol: fmt(t.v),
        move: (t.m > 0 ? '+' : '') + t.m.toFixed(1) + ' pts',
        moveColor: t.m >= 0 ? 'var(--positive)' : 'var(--echo-chart-red)',
        fill: t.m >= 0 ? 'var(--emerald)' : 'var(--echo-chart-red)',
        alpha, barAlpha: (Number(alpha) + 0.15).toFixed(2),
        border: on ? '2px solid var(--emerald)' : '1px solid var(--border-primary)',
        rowBg: on ? 'var(--emerald-bg)' : 'transparent',
        aria: t.name + ', ' + fmt(t.v) + ', ' + t.n + ' markets, average move ' + (t.m > 0 ? 'up ' : 'down ') + Math.abs(t.m).toFixed(1) + ' points',
        pick: () => this.setState({ sel: t.name })
      };
    };
    const tiles = out.map((t) => {
      const big = t.w > 96 && t.h > 72;
      return { ...decorate(t), big, l: (t.x / W * 100).toFixed(2) + '%', t: (t.y / H * 100).toFixed(2) + '%', w: (t.w / W * 100).toFixed(2) + '%', h: (t.h / H * 100).toFixed(2) + '%', pad: big ? '12px' : '6px 8px', fs: big ? '14px' : '11px' };
    });
    const venues = ['Polymarket', 'Kalshi', 'Both'].map((label) => ({ label, on: String(venue === label), cls: venue === label ? 'is-on' : '', pick: () => this.setState({ venue: label }) }));
    return {
      isDefault: s === 'default', isLoading: s === 'loading', isEmpty: s === 'empty', isError: s === 'error',
      showTree: s === 'default' && !mobile, showBar: s === 'default' && mobile,
      tiles, rows: items.map(decorate), venues,
      note: venue === 'Both' ? 'Kalshi counted at $1 per contract' : venue === 'Kalshi' ? 'Kalshi volume in contracts' : 'Polymarket volume in USD'
    };
  }
}
</script>
</body>
</html>
