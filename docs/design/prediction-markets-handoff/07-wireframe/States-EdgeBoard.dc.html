<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge board · states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pmk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pmk-root pmk-dark" style="width: 2880px; min-height: 1680px; padding: 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start;">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="pmk-kicker" style="color: var(--emerald-text);">{{s.label}}</div>
      <dc-import name="EdgeBoard" state="{{s.key}}" tab="{{s.tab}}" hint-size="1392px,720px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2880,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [
      { key: 'default', tab: 'cross', label: 'Default · Cross-venue gaps tab' },
      { key: 'loading', tab: 'model', label: 'Loading' },
      { key: 'empty', tab: 'model', label: 'Empty (common today)' },
      { key: 'error', tab: 'model', label: 'Error' }
    ] };
  }
}
</script>
</body>
</html>
