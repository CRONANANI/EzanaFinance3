<!doctype html>
<html lang="en">
<head>

<title>Top traders · trader expansion</title>

<x-dc>
<helmet>

  </div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div class="pmk-kicker" style="color: var(--emerald-text);">Signed out · positions gated</div>
    <dc-import name="TopTraders" expanded="{{ 0 }}" signed-out="{{ true }}" hint-size="800px,920px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1696,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
