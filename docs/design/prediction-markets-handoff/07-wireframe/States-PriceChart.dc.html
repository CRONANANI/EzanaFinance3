<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price chart · states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pmk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pmk-root pmk-dark" style="width: 1936px; min-height: 1620px; padding: 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start;">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="pmk-kicker" style="color: var(--emerald-text);">{{s.label}}</div>
      <dc-import name="PriceChart" state="{{s.key}}" hint-size="920px,680px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1936,"height":1620}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [['default', 'Default'], ['loading', 'Loading'], ['empty', 'Empty'], ['error', 'Error']].map(([key, label]) => ({ key, label })) };
  }
}
</script>
</body>
</html>
