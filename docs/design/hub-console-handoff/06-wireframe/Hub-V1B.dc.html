<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datasets hub · V1.1 Console rail below deck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.hub{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;color:#fff;background:linear-gradient(115deg,#032a21 0%,#064e3b 40%,#065f46 70%,#047857 100%);-webkit-font-smoothing:antialiased}
.hub .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hub a{color:#6ee7b7}.hub a:hover{color:#a7f3d0}
/* ticker: one continuous glass band, no pills, no outlines */
.tk1{height:46px;background:rgba(2,26,20,.62);display:flex;align-items:center;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent 0,black 56px,black calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,black 56px,black calc(100% - 56px),transparent 100%)}
.tk1-item{display:inline-flex;align-items:center;gap:10px;padding:0 20px;border-left:1px solid rgba(110,231,183,.14);line-height:1;white-space:nowrap}
.tk1-item:first-child{border-left:0}
/* console modules */
.ch{position:relative;flex:1 1 0;min-width:0;border-radius:10px;padding:12px 12px 10px;background:rgba(2,22,17,.42);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);display:flex;flex-direction:column;gap:9px}
.ch--road{opacity:.62}
.ch::before{content:'';position:absolute;left:50%;top:-27px;width:1px;height:27px;background:linear-gradient(to top,color-mix(in srgb,var(--c) 55%,transparent),rgba(110,231,183,.12))}
.deckwrap{position:relative;width:760px;height:430px;margin:0 auto;perspective:1200px}
.deck{position:absolute;left:50%;top:56px;width:520px;height:520px;transform:translateX(-50%) rotateX(57deg) rotateZ(45deg);background:linear-gradient(135deg,#111613,#090d0c 60%);border-radius:40px;box-shadow:0 46px 90px rgba(0,0,0,.55),inset 0 0 0 1px rgba(110,231,183,.16),inset 0 0 60px rgba(16,185,129,.06)}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(110,231,183,.2);border-radius:50%}
.sweep{position:absolute;left:50%;top:50%;width:392px;height:392px;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 18deg,rgba(16,185,129,.38),rgba(16,185,129,0) 85deg)}
.blip{position:absolute;left:58%;top:38%;width:9px;height:9px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 0 7px rgba(110,231,183,.14),0 0 18px rgba(110,231,183,.65)}
</style>
</helmet>
<div class="hub" style="width: 1440px; height: 1150px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;">

  <!-- nav -->
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 24px; padding: 0 28px;">
    <span aria-hidden="true" title="Existing Ezana pegasus mark" style="width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center;">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#ffffff" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 21c3-1 5-3 6-6l3-8 4 3 6-2-4 5 1 8"></path><path d="M10 15c2 1 5 1 8-1"></path></svg>
    </span>
    <!-- V1 ticker: one glass band, items divided by mint hairlines. No pills, no white ring. -->
    <div class="tk1" style="flex: 1; min-width: 0; border-radius: 12px;" aria-label="Latest signals">
      <sc-for list="{{news}}" as="n" hint-placeholder-count="6">
        <span class="tk1-item">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.8)" style="stroke-width: 1.4; stroke-linejoin: round;" aria-hidden="true"><path d="M8 1.5L14 4.5H2L8 1.5zM3 6.5v6M6.3 6.5v6M9.7 6.5v6M13 6.5v6M1.5 14.5h13"></path></svg>
          <span style="font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; color: rgba(255,255,255,0.95);">{{n.h}} <span style="color: #6ee7b7; font-weight: 600;">{{n.v}}</span></span>
          <span class="mono" style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: rgba(110,231,183,0.75);">{{n.m}}</span>
        </span>
      </sc-for>
    </div>
  </header>

  <!-- search -->
  <div style="flex: none; display: flex; justify-content: center; padding: 56px 0 18px;">
    <div style="width: 820px; height: 58px; border-radius: 9999px; background: rgba(2,24,18,0.45); box-shadow: inset 0 0 0 1px rgba(110,231,183,0.18); display: flex; align-items: center; padding: 0 10px 0 26px; gap: 16px;">
      <span style="flex: 1; font-size: 15px; color: rgba(255,255,255,0.55);">Try a person, a bank, a policy, a ticker…</span>
      <button type="button" style="height: 42px; padding: 0 22px; border: 0; border-radius: 9999px; background: rgba(110,231,183,0.14); color: #6ee7b7; font: 600 14px 'Plus Jakarta Sans', sans-serif; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="stroke-width: 1.6;" aria-hidden="true"><circle cx="8" cy="8" r="2"></circle><path d="M8 1a7 7 0 017 7M8 4a4 4 0 014 4"></path></svg>Ping
      </button>
    </div>
  </div>

  <!-- status line -->
  <div class="mono" style="flex: none; text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; color: rgba(255,255,255,0.5); padding-bottom: 10px;">
    7 DIMENSIONS · <span style="color: #6ee7b7;">24 OF 39 DATASETS LIVE</span> · 5 STREAMING
  </div>

  <!-- the deck they like, unchanged, now ahead of the rail -->
  <div class="deckwrap" aria-label="Sonar deck, existing component, unchanged">
    <div class="deck">
      <div class="ring" style="width: 392px; height: 392px;"></div>
      <div class="ring" style="width: 264px; height: 264px; border-color: rgba(110,231,183,0.16);"></div>
      <div class="ring" style="width: 136px; height: 136px; border-color: rgba(110,231,183,0.13);"></div>
      <div class="sweep"></div>
      <div class="blip"></div>
    </div>
    <span class="mono" style="position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(255,255,255,0.4); white-space: nowrap;">SONAR DECK · EXISTING COMPONENT, UNCHANGED</span>
  </div>
  <!-- V1.1: console rail docked BELOW the deck. The deck drains into the bus,
       and a stem rises into each channel strip. -->
  <div style="flex: none; width: 1240px; margin: 0 auto;">
    <!-- bus: the deck drains into the rail -->
    <div aria-hidden="true" style="position: relative; height: 64px;">
      <span style="position: absolute; left: 0; right: 0; top: 37px; height: 1px; background: linear-gradient(to right, transparent, rgba(110,231,183,0.35) 18%, rgba(110,231,183,0.35) 82%, transparent);"></span>
      <span style="position: absolute; left: 50%; top: -10px; width: 1px; height: 47px; background: linear-gradient(to bottom, rgba(110,231,183,0.1), rgba(110,231,183,0.5));"></span>
      <span style="position: absolute; left: 50%; top: -14px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #6ee7b7; box-shadow: 0 0 10px rgba(110,231,183,0.8);"></span>
    </div>
    <div style="display: flex; gap: 12px; align-items: stretch;">
      <sc-for list="{{dims}}" as="d" hint-placeholder-count="7">
        <button type="button" class="ch {{d.roadCls}}" style="--c: {{d.c}}; text-align: left; color: inherit; font: inherit; cursor: pointer;" aria-label="{{d.aria}}">
          <span style="display: flex; align-items: center; gap: 7px; min-width: 0;">
            <span aria-hidden="true" style="width: 7px; height: 7px; flex: none; border-radius: 50%; background: {{d.c}}; box-shadow: 0 0 8px color-mix(in srgb, {{d.c}} 70%, transparent);"></span>
            <span style="font-size: 11.5px; font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,0.94); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.n}}</span>
          </span>
          <svg width="100%" height="34" viewBox="0 0 134 34" preserveAspectRatio="none" aria-hidden="true" style="display: block;">
            <path d="M0 17H134" stroke="rgba(255,255,255,0.1)" stroke-width="1" vector-effect="non-scaling-stroke"></path>
            <polyline points="{{d.wave}}" fill="none" stroke="{{d.c}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="{{d.dash}}" vector-effect="non-scaling-stroke"></polyline>
          </svg>
          <span style="display: flex; gap: 4px;" aria-hidden="true">
            <sc-for list="{{d.ticks}}" as="t" hint-placeholder-count="5">
              <span style="width: 10px; height: 4px; border-radius: 2px; background: {{t.bg}}; box-shadow: {{t.ring}};"></span>
            </sc-for>
          </span>
          <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 6px;">
            <span class="mono" style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.95);">{{d.count}}</span>
            <span class="mono" style="font-size: 9px; font-weight: 600; letter-spacing: 0.14em; color: {{d.statusColor}};">{{d.status}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const DIMS = [
      { n: 'Capitol Watch', c: '#6ee7b7', live: 5, total: 5 },
      { n: 'Titans Shadow', c: '#c4b5fd', live: 9, total: 9 },
      { n: 'Eyes Above', c: '#67e8f9', live: 4, total: 4 },
      { n: 'Consumer Whispers', c: '#fcd34d', live: 0, total: 5 },
      { n: 'The Hive', c: '#f9a8d4', live: 2, total: 4 },
      { n: 'Global Empire Lighthouse', c: '#93c5fd', live: 4, total: 6 },
      { n: 'Regulatory Winds', c: '#d9f99d', live: 0, total: 6 }
    ];
    const wave = (seed, amp) => {
      const pts = [];
      for (let i = 0; i <= 26; i++) {
        const x = (i / 26) * 134;
        const y = 17 - amp * (Math.sin(i * 0.9 + seed * 2.1) * 0.7 + Math.sin(i * 0.37 + seed) * 0.3) * 11;
        pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      }
      return pts.join(' ');
    };
    const dims = DIMS.map((d, i) => {
      const road = d.live === 0;
      return {
        ...d,
        roadCls: road ? 'ch--road' : '',
        wave: road ? '0,17 134,17' : wave(i + 1, 0.55 + (d.live / d.total) * 0.45),
        dash: road ? '3 5' : '0',
        count: d.live + '/' + d.total,
        status: road ? 'ROADMAP' : 'LIVE',
        statusColor: road ? 'rgba(255,255,255,0.45)' : '#6ee7b7',
        aria: d.n + ', ' + d.live + ' of ' + d.total + ' datasets live',
        ticks: Array.from({ length: d.total }, (_, k) => ({
          bg: k < d.live ? d.c : 'transparent',
          ring: k < d.live ? 'none' : 'inset 0 0 0 1px rgba(255,255,255,0.3)'
        }))
      };
    });
    return {
      dims,
      news: [
        { h: 'Government Acquisitions wins', v: '$313K', m: 'HOMELAND SECURITY' },
        { h: 'Sen. Whitehouse sells ADI', v: '$1K - $15K', m: 'SENATE' },
        { h: 'Regency Consulting wins', v: '$208K', m: 'JUSTICE' },
        { h: 'Rep. Gottheimer buys MSFT', v: '$15K - $50K', m: 'HOUSE' },
        { h: 'Lobbying: Meta spends', v: '$5.2M', m: 'Q3 FILING' },
        { h: 'Patent momentum: NVDA', v: '+38 FILINGS', m: 'EYES ABOVE' }
      ]
    };
  }
}
</script>
</body>
</html>
