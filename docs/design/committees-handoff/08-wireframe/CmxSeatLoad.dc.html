<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seat load</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./cmx.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="cmx-root" style="width: 100%; display: flex;">
<section class="cmx-card" aria-labelledby="cmx-sl-t" style="flex: 1; width: 100%; display: flex; flex-direction: column;">
  <div class="cmx-head">
    <div>
      <h2 id="cmx-sl-t" class="cmx-title">Seat load</h2>
      <p class="cmx-sub">Committee and subcommittee seats per member</p>
    </div>
  </div>

  <sc-if value="{{isDefault}}" hint-placeholder-val="{{ true }}">
    <figure style="margin: 0 0 16px; display: flex; flex-direction: column; gap: 6px;">
      <div role="img" aria-label="{{summary}}" style="display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-left: 4px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="10">
          <span style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%;">
            <span class="cmx-mono" style="font-size: 9.5px; color: var(--text-faint);">{{b.n}}</span>
            <span style="width: 100%; height: {{b.h}}; background: var(--echo-chart-blue); opacity: 0.75; border-radius: 3px 3px 0 0;"></span>
          </span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px; padding-left: 4px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="10">
          <span class="cmx-mono" style="flex: 1; text-align: center; font-size: 9.5px; color: var(--text-faint);">{{b.x}}</span>
        </sc-for>
      </div>
      <figcaption style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">{{summary}}</figcaption>
    </figure>

    <div class="cmx-kicker" style="font-size: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-secondary);">Most seats held</div>
    <ol style="list-style: none; margin: 0 -8px; padding: 0;">
      <sc-for list="{{tops}}" as="r" hint-placeholder-count="5">
        <li>
          <button type="button" class="cmx-row cmx-row-btn" style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; min-height: 42px;" aria-label="Open member lookup for {{r.name}}">
            <span class="cmx-avatar" style="width: 26px; height: 26px; font-size: 9.5px;" aria-hidden="true">{{r.init}}</span>
            <span class="cmx-ellipsis" style="flex: 1; font-size: 12.5px; font-weight: 500; color: var(--text-primary);">{{r.name}}</span>
            <span class="cmx-party">{{r.party}}</span>
            <span class="cmx-mono" style="font-size: 10px; color: var(--text-faint); width: 22px;">{{r.st}}</span>
            <span class="cmx-track" style="width: 64px; height: 5px;" aria-hidden="true"><span style="width: {{r.w}};"></span></span>
            <span class="cmx-mono" style="font-size: 13px; font-weight: 700; color: var(--text-primary); width: 20px; text-align: right;">{{r.n}}</span>
          </button>
        </li>
      </sc-for>
    </ol>
  </sc-if>

  <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
    <div aria-busy="true" aria-label="Loading seat load" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-end; gap: 6px; height: 150px;">
        <sc-for list="{{ten}}" as="x" hint-placeholder-count="10"><span class="cmx-skel" style="flex: 1; height: {{x.h}};"></span></sc-for>
      </div>
      <sc-for list="{{fiveS}}" as="x" hint-placeholder-count="5"><span class="cmx-skel" style="height: 30px;"></span></sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
    <div class="cmx-statebox" style="flex: 1; min-height: 320px;">
      <div style="font-size: 15px; font-weight: 600; color: var(--text-primary);">No members match these filters</div>
      <p class="cmx-state" style="margin: 0; max-width: 380px;">No <span style="color: var(--text-primary);">I</span> member holds a seat on a <span style="color: var(--text-primary);">Semis</span> mapped committee. Widen the party or sector.</p>
    </div>
  </sc-if>

  <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
    <div role="alert" class="cmx-statebox" style="flex: 1; min-height: 320px; align-items: flex-start;">
      <p class="cmx-state" style="margin: 0;">This data is unavailable right now. Try again in a moment.</p>
      <button type="button" class="cmx-link" style="background: none; border: 0; font-size: 14px; padding: 0;">Retry</button>
    </div>
  </sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","loading","empty","error"],"default":"default"},"viewport":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"$preview":{"width":578,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'default';
    const H = [18, 64, 118, 131, 96, 58, 28, 12, 4, 2];
    const max = Math.max(...H);
    return {
      isDefault: s === 'default', isLoading: s === 'loading', isEmpty: s === 'empty', isError: s === 'error',
      bars: H.map((n, i) => ({ n, x: i === 9 ? '10+' : String(i + 1), h: Math.round((n / max) * 118) + 'px' })),
      summary: 'Most members hold 3 to 5 seats; 18 hold a single seat and 6 hold nine or more.',
      tops: [
        { name: '[Member name]', init: 'S1', party: 'R', st: 'MS', n: 11, w: '100%' },
        { name: '[Member name]', init: 'S2', party: 'D', st: 'IL', n: 10, w: '91%' },
        { name: '[Member name]', init: 'S3', party: 'R', st: 'ND', n: 10, w: '91%' },
        { name: '[Member name]', init: 'S4', party: 'D', st: 'HI', n: 9, w: '82%' },
        { name: '[Member name]', init: 'S5', party: 'R', st: 'KS', n: 9, w: '82%' }
      ],
      ten: Array.from({ length: 10 }, (_, i) => ({ h: (20 + ((i * 29) % 70)) + '%' })),
      fiveS: [1, 2, 3, 4, 5]
    };
  }
}
</script>
</body>
</html>
