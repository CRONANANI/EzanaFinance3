# Ezana iOS and Android release builds. Both workflows run only when started
# by hand in Codemagic (no triggering on push). Every secret lives in the
# Codemagic environment groups named below; see docs/APP_STORE_SUBMISSION.md
# for the full list of variables.

definitions:
  node: &node
    node: 22
  install: &install
    - name: Install dependencies
      script: npm ci

workflows:
  android-release:
    name: Android release (Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *node
      java: 21
      groups:
        - android_signing # CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, GOOGLE_SERVICES_JSON (base64)
    scripts:
      - *install
      - name: Firebase config for push
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Capacitor sync
        script: npx cap sync android
      - name: Upload keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/ezana-upload.keystore
          echo "CM_KEYSTORE_PATH=/tmp/ezana-upload.keystore" >> $CM_ENV
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *node
      xcode: latest
      groups:
        - app_store_connect # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
    scripts:
      - *install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Code signing (automatic, App Store Connect API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "world.ezana.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
