name: Lighthouse worker

# Weekly: the Caldara and Iacoviello GPR index (Python; the files are .xls).
# Tuesday, after the Monday daily-file update. Manual runs any time.
on:
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # An unset repository secret arrives as an empty string (the 20 Oct run
      # failed on "unknown url type: '/rest/v1/...'"); name it instead.
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r workers/lighthouse/requirements.txt
      - name: GPR
        working-directory: workers/lighthouse
        run: python gpr.py
