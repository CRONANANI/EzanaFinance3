name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same ref so a quick
# follow-up push doesn't keep an old run alive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Format check + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Prettier (check formatting on adopted paths)
        # Phase 1 introduces Prettier incrementally. `format:check` only
        # checks the paths we've explicitly adopted (docs, root configs).
        # The husky pre-commit hook + lint-staged is the actual enforcement
        # gate for source files; this step catches anyone who bypasses the
        # hook with --no-verify on the adopted paths.
        # As future phases adopt more directories, expand the glob in
        # package.json's format:check script.
        run: npm run format:check

      - name: ESLint (next lint)
        # eslint-config-next runs Next.js rules + our no-restricted-imports
        # rule for legacy Supabase modules. Warnings do not fail the build
        # during the Phase 2 migration; errors still do.
        run: npm run lint

      - name: CSS var() fallback guard
        # Bans hardcoded colour fallbacks inside var() on surface/neutral/text
        # tokens (e.g. var(--surface-card, rgba(255,255,255,.02))). Those
        # fallbacks paint the wrong colour in a broken scope — the "lighter
        # slab in dark mode" bug class. Hard-fails so a new one can't land.
        run: npm run lint:css

      - name: Architecture rules (dependency-cruiser)
        # No dependency cycles; presentation layer (components/hooks/contexts)
        # must not reach the server Supabase surface, even transitively.
        # Orphan detection under src/lib is warn-only.
        run: npm run lint:arch

      - name: Dead-code inventory (knip)
        # Non-blocking by design: dead-code detection has false positives
        # (dynamic imports, string-referenced modules) and must never block
        # a feature PR. Treat the output as an inventory to review.
        run: npm run lint:dead
        continue-on-error: true

      - name: Unit tests (node:test suites)
        # Business-logic unit tests: whale score, house disclosures,
        # competition onboarding, judge scoring, recruiting consent,
        # council ELO, profile financial metrics, security guards.
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stub environment
        # next build needs every integration env var present because a few
        # libs construct clients eagerly at module load. Generate stub values
        # for everything declared in .env.example (kept automatically in
        # sync); the handful of keys that are shape-validated get plausible
        # shapes. No real secrets exist in CI — Vercel builds with real env.
        run: |
          node -e "
            const fs = require('fs');
            const stub = {
              NEXT_PUBLIC_SUPABASE_URL: 'https://stub.supabase.co',
              SUPABASE_SERVICE_ROLE_KEY: 'stub-service-role-key',
              NEXT_PUBLIC_SUPABASE_ANON_KEY: 'stub-anon-key',
              STRIPE_SECRET_KEY: 'sk_test_stub',
              RESEND_API_KEY: 're_stub',
            };
            const names = [...fs.readFileSync('.env.example', 'utf8').matchAll(/^([A-Z0-9_]+)=/gm)].map((m) => m[1]);
            fs.writeFileSync('.env.local', [...new Set(names)].map((n) => n + '=' + (stub[n] || 'stub')).join('\n') + '\n');
          "

      - name: Build
        run: npm run build
