name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Check for critical vulnerabilities
        # Fails on any critical advisory EXCEPT explicitly accepted ones.
        # Accepted risks (review at every Next.js upgrade):
        #   GHSA-p293-qw3h-jr36 — Next.js RCE on WINDOWS-hosted servers.
        #     We deploy exclusively on Vercel (Linux); not exploitable here.
        #   GHSA-2xp9-vwfh-vxw4 — Next.js Image Optimizer AVIF RCE (self-hosted).
        #     On Vercel, image optimization is served by Vercel's platform
        #     optimizer, which Vercel patches platform-side.
        # Real fix for both: upgrade next 14 -> 16 (tracked in
        # docs/REFACTOR_ROADMAP.md). Do NOT add entries here without a
        # written justification.
        run: |
          ACCEPTED='GHSA-p293-qw3h-jr36 GHSA-2xp9-vwfh-vxw4'
          UNACCEPTED=$(npm audit --json 2>/dev/null | jq -r --arg accepted "$ACCEPTED" '
            [.vulnerabilities[]?.via[]? | objects | select(.severity == "critical")
             | .url | split("/") | last | select(. as $id | ($accepted | split(" ") | index($id)) == null)]
            | unique | .[]')
          if [ -n "$UNACCEPTED" ]; then
            echo "::error::Unaccepted critical advisories found:"
            echo "$UNACCEPTED"
            exit 1
          fi
          echo "No unaccepted critical advisories."
