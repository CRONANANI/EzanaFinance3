name: Dataset perf budget

# Warm LCP <= 1.0 s and first-load JS <= 200 KB on every dataset route,
# measured against the PR's Vercel preview deployment.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to measure
        required: true

permissions:
  contents: read
  deployments: read

jobs:
  budget:
    # Vercel posts deployment_status for every deployment; measure only the
    # successful previews (the production deploy is covered by Speed Insights).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only when dataset code changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base origin/main "${{ github.event.deployment.sha }}" || echo origin/main)
          if git diff --name-only "$base" "${{ github.event.deployment.sha }}" | grep -qE '^src/(app|lib)/datasets/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.changed.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Budget
        if: steps.changed.outputs.run == 'true'
        env:
          BASE_URL: ${{ github.event.inputs.base_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/perf/budget.mjs
