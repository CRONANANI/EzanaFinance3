name: Eyes Above worker

# Monthly: NASA Black Marble night lights and the NY Fed GSCPI (Python).
# Manual: a patents backfill or a PortWatch / FRED run (Node, the same code
# as the Vercel crons), or either Python job with a longer window.
on:
  schedule:
    - cron: '17 6 15 * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'night_lights | gscpi | regions | patents_backfill | portwatch | fred | all (all = regions + gscpi + night_lights)'
        default: 'all'
        required: true
      months_back:
        description: 'night lights: months to (re)compute'
        default: '3'
      from:
        description: 'patents_backfill: first grant date (YYYY-MM-DD)'
        default: '2024-10-01'
      to:
        description: 'patents_backfill: last grant date (YYYY-MM-DD), blank for today'
        default: ''

permissions:
  contents: read

jobs:
  python:
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'night_lights' || inputs.job == 'gscpi' || inputs.job == 'regions'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
      JOB: ${{ inputs.job || 'all' }}
      MONTHS_BACK: ${{ inputs.months_back || '3' }}
    steps:
      # An unset repository secret arrives as an empty string; name it.
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ "$JOB" = "all" ] || [ "$JOB" = "night_lights" ]; then
            [ -n "$NASA_EARTHDATA_TOKEN" ] || missing="$missing NASA_EARTHDATA_TOKEN"
          fi
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r workers/eyes/requirements.txt
      # eyes_regions from regions.json first (standard library only), so the
      # region list lands even if the night-lights download fails.
      - name: Seed regions
        if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'night_lights' || inputs.job == 'regions'
        working-directory: workers/eyes
        run: python seed_regions.py
      - name: GSCPI
        if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'gscpi'
        working-directory: workers/eyes
        run: python gscpi.py
      # Runs even when GSCPI failed: the two sources are independent.
      - name: Night lights
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'night_lights') }}
        working-directory: workers/eyes
        run: python night_lights.py --months-back "$MONTHS_BACK"

  node:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'patents_backfill' || inputs.job == 'portwatch' || inputs.job == 'fred')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      JOB: ${{ inputs.job }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ "$JOB" = "patents_backfill" ]; then [ -n "$PATENTSVIEW_API_KEY" ] || missing="$missing PATENTSVIEW_API_KEY"; fi
          if [ "$JOB" = "fred" ]; then [ -n "$FRED_API_KEY" ] || missing="$missing FRED_API_KEY"; fi
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Patents backfill
        if: inputs.job == 'patents_backfill'
        run: node scripts/ingest-eyes.mjs patents --from="$FROM" ${TO:+--to="$TO"}
      - name: PortWatch
        if: inputs.job == 'portwatch'
        run: node scripts/ingest-eyes.mjs portwatch
      - name: FRED
        if: inputs.job == 'fred'
        run: node scripts/ingest-eyes.mjs fred
