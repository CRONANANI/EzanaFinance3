[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spo"
version = "0.1.0"
description = "Sentiment portfolio optimization: a HARLF reproduction scaffold plus an Ezana-data sentiment variant."
requires-python = ">=3.10"

# Split deliberately. The core is what the env, the feature builders, the
# backtest and the report need, and it installs in seconds on CPU. The RL and
# NLP extras are heavy (torch pulls ~2GB), so anything that does not need an
# agent — metrics, features, the Ezana export — stays runnable without them.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
rl = ["torch>=2.2", "gymnasium>=0.29", "stable-baselines3>=2.3"]
nlp = ["torch>=2.2", "transformers>=4.40"]
ezana = ["supabase>=2.4"]
all = [
  "yfinance>=0.2.40",
  "torch>=2.2",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "transformers>=4.40",
  "supabase>=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
